name: pre-commit

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same hooks as the local commit stage; commit-msg hooks do not apply here.
      # Runs prek run --all-files and caches ~/.cache/prek on the config hash.
      - name: Run hooks on all files
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: 'v0.5.11'
          # The action skips verification for versions missing from its bundled checksums: bump with prek-version.
          sha256: 'a4ff4c70aef6f21925aa52b82d0746095fbd66893ac3b053e859f6d3454c16ae'
