name: weekly-software-check

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: weekly-software-check
  cancel-in-progress: false

permissions: {}

jobs:
  # ── Homebrew ──────────────────────────────────────────────────────────────
  check-brew:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/linuxbrew/.linuxbrew
          key: homebrew-${{ runner.os }}-v1

      - name: Install Homebrew
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Add Homebrew to PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Update Homebrew
        run: brew update --quiet

      - name: Validate formulas
        run: |
          removed=()
          while IFS= read -r line; do
            formula=$(echo "$line" | sed 's/^brew "\([^"]*\)".*/\1/')

            # Skip tap formulas (owner/tap/name): may be macOS-only even if tap loads
            if [[ "$formula" == *"/"* ]]; then
              echo "Skipping tap formula (platform check skipped): $formula"
              continue
            fi

            # A transient brew failure once dropped a live formula (yarn):
            # retry, and remove only when the API confirms a 404.
            ok=false
            for _ in 1 2 3; do
              if err=$(brew info "$formula" 2>&1 >/dev/null); then ok=true; break; fi
              sleep 5
            done
            if [[ "$ok" == false ]]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' "https://formulae.brew.sh/api/formula/${formula}.json" || true)
              if [[ "$code" != "404" ]]; then
                echo "::warning::brew info failed for $formula but API answered $code, keeping it: $err"
                continue
              fi
              echo "::warning::Invalid formula: $formula ($err)"
              removed+=("$formula")
              # Use # as sed delimiter to avoid clashes with / in formula names
              escaped=$(printf '%s\n' "$formula" | sed 's/[[\.*^$()+?{|#]/\\&/g')
              sed -i "\#^brew \"${escaped}\"#d" packages/Brewfile
            fi
          done < <(grep '^brew "' packages/Brewfile)

          printf '%s\n' "${removed[@]}" > removed_formulas.txt

      - name: Validate casks
        run: |
          removed=()
          while IFS= read -r line; do
            cask=$(echo "$line" | sed 's/^cask "\([^"]*\)".*/\1/')

            # Skip tap casks (owner/tap/name): not available on formulae.brew.sh
            if [[ "$cask" == *"/"* ]]; then
              echo "Skipping tap cask (platform check skipped): $cask"
              continue
            fi

            if ! curl -fsSL "https://formulae.brew.sh/api/cask/${cask}.json" > /dev/null 2>&1; then
              echo "::warning::Invalid cask: $cask"
              removed+=("$cask")
              escaped=$(printf '%s\n' "$cask" | sed 's/[[\.*^$()+?{|#]/\\&/g')
              sed -i "\#^cask \"${escaped}\"#d" packages/Brewfile
            fi
          done < <(grep '^cask "' packages/Brewfile || true)

          printf '%s\n' "${removed[@]}" >> removed_formulas.txt

      - name: Write job summary
        run: |
          {
            echo "### Brew formulas & casks (Linux formulas only)"
            if [ -s removed_formulas.txt ]; then
              echo "Removed (no longer available):"
              echo '```'
              cat removed_formulas.txt
              echo '```'
            else
              echo "All formulas and casks valid ✓"
            fi
            echo ""
            echo "> Tap formulas and tap casks (\`owner/tap/name\`) are skipped: platform-specific."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brew-results
          retention-days: 1
          path: |
            packages/Brewfile
            removed_formulas.txt

  # ── PR ────────────────────────────────────────────────────────────────────
  create-pr:
    needs: [check-brew]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the branch the PR is opened from
      pull-requests: write  # opening the PR itself
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download brew results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brew-results
          path: /tmp/brew-results

      - name: Apply changes
        run: cp /tmp/brew-results/packages/Brewfile packages/Brewfile

      - name: Build PR description
        run: |
          {
            echo "## Weekly software validity check"
            echo ""
            echo "### Brew formulas & casks (Linux formulas only)"
            if [ -s /tmp/brew-results/removed_formulas.txt ]; then
              echo "Removed (no longer available):"
              echo '```'
              cat /tmp/brew-results/removed_formulas.txt
              echo '```'
            else
              echo "All formulas and casks valid ✓"
            fi
            echo ""
            echo "> Tap formulas and tap casks (\`owner/tap/name\`) are skipped: too platform-specific to validate on Linux."
          } > /tmp/pr_body.txt

      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/weekly-software-check
          commit-message: "chore: remove invalid brew formulas"
          title: "chore: weekly software validity check"
          body-path: /tmp/pr_body.txt
          add-paths: packages/Brewfile
          labels: maintenance
          delete-branch: true
